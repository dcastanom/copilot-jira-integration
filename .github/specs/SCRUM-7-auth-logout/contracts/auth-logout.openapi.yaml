openapi: 3.0.3
info:
  title: Auth Logout API
  version: 1.0.0
paths:
  /auth/logout:
    post:
      summary: Logout the current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out successfully
                required: [message]
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid token
                required: [error]
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
